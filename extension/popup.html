<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobPilot AI Companion</title>
  <style>
    :root {
      --canvas: #090a0f;
      --surface: #0f1118;
      --raised: #151823;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.15);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-muted: rgba(59, 130, 246, 0.15);
      --status-online: #10b981;
      --status-offline: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: var(--canvas);
      color: var(--text-main);
      font-family: var(--font-ui);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .pop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .pop-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .pop-brand-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-muted);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 1px 5px;
      border-radius: var(--radius-sm);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--status-online);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-pill.offline {
      background: rgba(239, 68, 68, 0.12);
      color: var(--status-offline);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-online);
      box-shadow: 0 0 8px var(--status-online);
    }

    .status-pill.offline .status-dot {
      background: var(--status-offline);
      box-shadow: none;
    }

    .btn-ping {
      background: var(--raised);
      border: 1px solid var(--border-hairline);
      color: var(--text-muted);
      font-size: 10.5px;
      font-family: var(--font-mono);
      padding: 3px 7px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .btn-ping:hover {
      background: #1e2333;
      color: #fff;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .job-portal-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }

    .job-title-text {
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-company-text {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-apply-primary {
      background: var(--accent);
      border: 1px solid #60a5fa;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.35);
      width: 100%;
    }

    .btn-apply-primary:hover {
      background: var(--accent-hover);
    }

    .btn-apply-primary.running {
      background: #dc2626;
      border-color: #ef4444;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.4);
    }

    .btn-sync-secondary {
      background: var(--raised);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      transition: all 0.15s ease;
    }

    .btn-sync-secondary:hover {
      background: #1c2132;
      border-color: var(--border-subtle);
      color: #fff;
    }

    .cand-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .cand-name {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    .cand-tier {
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--status-online);
    }

    .cand-sub {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .notice-bar {
      background: #0b0d14;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="pop-header">
    <div class="pop-brand">
      <span>⚡</span>
      <span>JobPilot Companion</span>
      <span class="pop-brand-badge">v2.5</span>
    </div>
    <div class="status-group">
      <div class="status-pill" id="bridge-status-pill">
        <span class="status-dot"></span>
        <span id="bridge-status-text">ONLINE</span>
      </div>
      <button class="btn-ping" id="btn-reconnect" title="Test Desktop Bridge Connection">⟳ Ping</button>
    </div>
  </div>

  <!-- Detected Job Card -->
  <div class="card" id="card-detected-job">
    <div class="card-header-row">
      <span class="card-title">DETECTED ACTIVE JOB</span>
      <span class="job-portal-badge" id="job-portal">DETECTING...</span>
    </div>
    <div class="job-title-text" id="job-title">Scanning active browser tab...</div>
    <div class="job-company-text">
      <span id="job-company">Open any job on Indeed, foundit, or careers portal</span>
      <span style="color: var(--border-subtle);">&bull;</span>
      <span id="job-location" style="color: var(--text-dim);">India / Remote</span>
    </div>
  </div>

  <!-- 1-Click Autonomous Action -->
  <div class="card" style="gap: 8px;">
    <button class="btn-apply-primary" id="btn-popup-tab-agent">
      <span>⚡</span> <span id="agent-btn-text">Start Autonomous Apply Agent</span>
    </button>
    <button class="btn-sync-secondary" id="btn-popup-sync">
      <span>📋</span> <span>Sync Application to Desktop Ledger</span>
    </button>
  </div>

  <!-- Candidate Profile Badge & Edit Section -->
  <div class="card" id="card-candidate-profile">
    <div class="cand-row">
      <span class="cand-name" id="cand-name">Vansh Sharma</span>
      <span class="cand-tier">MCA 2026 | Immediate</span>
    </div>
    <div class="cand-sub" id="cand-edu">Graphic Era Hill University : CGPA 8.0 : AI & Data Science</div>
    <div style="margin-top: 6px;">
      <button class="btn-sync-secondary" id="btn-toggle-edit-cand" style="font-size: 10.5px; padding: 4px 8px;">
        <span>✏️</span> <span>Review & Edit Candidate Profile</span>
      </button>
    </div>
    <div id="pop-cand-edit-drawer" style="display: none; flex-direction: column; gap: 6px; margin-top: 8px; border-top: 1px solid var(--border-hairline); padding-top: 8px;">
      <div>
        <label style="font-size: 9.5px; color: var(--text-dim); text-transform: uppercase;">Full Name</label>
        <input type="text" id="pop-input-name" style="width: 100%; background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px;" value="Vansh Sharma" />
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="flex: 1;">
          <label style="font-size: 9.5px; color: var(--text-dim); text-transform: uppercase;">Email</label>
          <input type="email" id="pop-input-email" style="width: 100%; background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px;" value="engagevansh@gmail.com" />
        </div>
        <div style="flex: 1;">
          <label style="font-size: 9.5px; color: var(--text-dim); text-transform: uppercase;">Phone</label>
          <input type="text" id="pop-input-phone" style="width: 100%; background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px;" value="+919368478556" />
        </div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="flex: 1;">
          <label style="font-size: 9.5px; color: var(--text-dim); text-transform: uppercase;">Expected CTC</label>
          <input type="text" id="pop-input-ctc" style="width: 100%; background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px;" value="Negotiable (6 - 10 LPA)" />
        </div>
        <div style="flex: 1;">
          <label style="font-size: 9.5px; color: var(--text-dim); text-transform: uppercase;">Notice Period</label>
          <input type="text" id="pop-input-notice" style="width: 100%; background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px;" value="Immediate" />
        </div>
      </div>
      <div>
        <label style="font-size: 9.5px; color: var(--text-dim); text-transform: uppercase;">Pitch / AI Bio</label>
        <textarea id="pop-input-pitch" rows="2" style="width: 100%; background: #000; border: 1px solid var(--border-subtle); color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 10.5px;">MCA in AI & Data Science (Class of 2026). Hands-on experience developing LangChain RAG pipelines, fine-tuning PyTorch models, and scaling FastAPI microservices. Immediate joiner.</textarea>
      </div>
      <button class="btn-apply-primary" id="pop-btn-save-cand" style="padding: 6px 10px; font-size: 11px; margin-top: 4px;">
        <span>💾</span> <span>Save Candidate Details</span>
      </button>
    </div>
  </div>

  <!-- Live Status Footer -->
  <div class="notice-bar">
    <span id="popup-notice">Desktop Bridge: 127.0.0.1:5056</span>
    <span id="popup-ping-ms" style="color: var(--status-online);">2ms</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
